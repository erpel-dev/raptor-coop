name: CI and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    name: Linux tests (setup ${{ matrix.setup }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        setup: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_SETUP=${{ matrix.setup }} -DRAPTOR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --no-tests=error

  desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-14
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_SETUP=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_WITH_SETUP=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Package
        run: python scripts/package-release.py --build-dir build --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: raptor-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [regressions, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version and notes
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: raptor-*
          path: dist
          merge-multiple: true
      - name: Verify packages
        shell: bash
        run: |
          cd dist
          test "$(find . -name '*.sha256' | wc -l)" -eq 3
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Raptor Co-op $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
